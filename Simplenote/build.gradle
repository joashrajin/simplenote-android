apply plugin: 'com.android.application'
apply plugin: 'io.sentry.android.gradle'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'dagger.hilt.android.plugin'
// Adds recordRoborazzi<Variant> / verifyRoborazzi<Variant> / compareRoborazzi<Variant> tasks for
// the screenshot tests under src/test/java/com/automattic/simplenote/screenshottest.
apply plugin: 'io.github.takahirom.roborazzi'
apply plugin: 'androidx.baselineprofile'

def versionProperties = loadPropertiesFromFile(file("${rootDir}/version.properties"))

android {
    namespace 'com.automattic.simplenote'
    compileSdk 36

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Dedicated build type for screenshots so that we can add the special
        // permissions only to it, keeping debug and release closer together to
        // make bug hunting easier.
        screenshots {
            initWith debug
        }
    }

    defaultConfig {
        applicationId "com.automattic.simplenote"

        // Allow versionName to be overridden with property. e.g. -PversionName=1234
        if (project.hasProperty("versionName")) {
            versionName project.property("versionName")
        } else {
            versionName versionProperties.getProperty("versionName")
        }
        versionCode versionProperties.getProperty("versionCode").toInteger()

        minSdkVersion 23
        targetSdkVersion 36

        // The manifest merger permits exactly one <instrumentation> entry (AGP stamps the
        // configured runner's name onto any declared in a source manifest), so the runner is
        // switched at build time instead: the fastlane screenshots lane assembles the test APK
        // with -PscreenshotInstrumentation to declare ScreenshotAppRunner, which keeps the
        // production application class that ScreenshotTest's real-account flow needs.
        testInstrumentationRunner project.hasProperty('screenshotInstrumentation') \
            ? 'com.automattic.simplenote.ScreenshotAppRunner' \
            : 'com.automattic.simplenote.SimplenoteAppRunner'
        // ScreenshotTest logs in to a real account. The fastlane take_screenshots lane runs it separately.
        testInstrumentationRunnerArgument 'notClass', 'com.automattic.simplenote.screenshots.ScreenshotTest'

        buildConfigField "String", "SENTRY_DSN", "\"https://89e443ca3fd84e588d1809cfbfcc40f4@sentry.io/1455558\""
    }


    testOptions {
        unitTests.returnDefaultValues = true
        // Required by the Robolectric screenshot tests (screenshottest package) to load real
        // resources; inert for the plain-JVM suite, which keeps relying on returnDefaultValues
        // because Robolectric replaces the stubbed android.jar with its own runtime.
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric's native graphics runtime needs more than the default 512m test heap.
            maxHeapSize = "2g"
        }
        // Disable animations in order to enter text in the text inputs in the
        // Espresso tests
        animationsDisabled = true
    }

    // Built-in Kotlin derives the Kotlin jvmTarget from targetCompatibility.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    viewBinding {
        enabled = true
    }
    buildFeatures {
        buildConfig true
        // The Compose compiler version comes from the Kotlin-bundled plugin; no composeOptions
        // block on Kotlin 2.x.
        compose true
    }
    lint {
        checkReleaseBuilds false
    }
}

// Known issue: AGP 9.5 registers generate<Variant>ComposePreviewRunfiles for every Compose variant, and creating it
// throws on variants without unit tests (all but debug, including the variants this plugin adds). So
// `./gradlew tasks` fails; building, testing and linting do not realize those tasks. Re-enabling unit tests on
// every variant fixes the listing but breaks `./gradlew test`: the screenshot tests import debug-only sources.
baselineProfile {
    // R8 moves the classes in startup-prof.txt into their own leading DEX file. R8 rejects wildcard rules
    // there, unlike in baseline-prof.txt.
    dexLayoutOptimization = true
}

sentry {
    org = "a8c"
    projectName = "simplenote-android"
    authToken = providers.environmentVariable("SENTRY_AUTH_TOKEN").orNull
    autoInstallation.enabled = false
}

buildscript {
    dependencies {
        classpath "io.sentry:sentry-android-gradle-plugin:$sentryVersion"
        classpath "io.github.takahirom.roborazzi:roborazzi-gradle-plugin:$roborazziVersion"
    }

    repositories {
        google()
        mavenCentral()
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    // AGP 9 adds a resources-only copy of each dependency jar to the unit test classpath. Mockito's
    // objenesis 3.3 ships a META-INF/INDEX.LIST that its copy keeps, so JDK 17 throws InvalidJarIndexError
    // when Robolectric looks up org/**/robolectric.properties. objenesis 3.5+ no longer ships the index.
    testImplementation 'org.objenesis:objenesis:3.6'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.annotation:annotation:1.9.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    // Hilt instrumentation harness: HiltTestApplication (installed by SimplenoteAppRunner) and the
    // TestDataModule @TestInstallIn replacement of DataModule.
    androidTestImplementation "com.google.dagger:hilt-android-testing:$google_dagger"
    kspAndroidTest "com.google.dagger:hilt-compiler:$google_dagger"
    // Infrastructure to test fragments
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation "org.mockito.kotlin:mockito-kotlin:6.0.0"


    // Support for JsonObjects in unit tests since they are used by BucketObjects
    testImplementation 'org.json:json:20260719'

    // Roborazzi screenshot tests (screenshottest package): Robolectric native-graphics rendering,
    // ActivityScenario, and Hilt test components for launching @AndroidEntryPoint activities.
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:$roborazziVersion"
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation "com.google.dagger:hilt-android-testing:$google_dagger"
    kspTest "com.google.dagger:hilt-compiler:$google_dagger"

    // Fastlane screengrab for screenshots automation
    androidTestImplementation "tools.fastlane:screengrab:$screengrabVersion"
    // Automattic and WordPress dependencies
    implementation 'com.automattic:simperium:v1.4.0'
    implementation "com.automattic:Automattic-Tracks-Android:$automatticTracksVersion"
    implementation "com.automattic.tracks:crashlogging:$automatticTracksVersion"

    // Kotlin's coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Google Support
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.work:work-runtime:2.10.3'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    // Support for ViewModels and LiveData
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.8"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidxLifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidxLifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidxLifecycleVersion"
    testImplementation "androidx.lifecycle:lifecycle-runtime-testing:$androidxLifecycleVersion"
    // Support for androidx Fragments
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$androidxLifecycleVersion"

    // Jetpack Compose (SimplenoteTheme bridge; screens arrive in later PRs). The BOM pins every
    // androidx.compose artifact version; it must also be applied to the test configurations,
    // which do not inherit the main one's platform.
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    testImplementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose'
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$androidxLifecycleVersion"
    // The candidate screens' ViewModels all expose LiveData.
    implementation 'androidx.compose.runtime:runtime-livedata'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.compose.ui:ui-test-junit4'

    // Third Party
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    implementation("org.jetbrains:markdown:0.7.3")
    implementation 'net.openid:appauth:0.11.1'

    // Dagger Hilt dependencies
    implementation "com.google.dagger:hilt-android:$google_dagger"
    ksp "com.google.dagger:hilt-compiler:$google_dagger"

    implementation project(':PasscodeLock')

    // Compose already pulls this in; declared so baseline.prof keeps installing on sideloads and
    // non-Play stores if that transitive edge goes away.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    baselineProfile project(':baselineprofile')
}

repositories {
    maven {
        url "https://a8c-libs.s3.amazonaws.com/android"
        content {
            includeGroup "com.automattic"
            includeGroup "com.automattic.tracks"
        }
    }
    maven { url "https://maven.google.com" }
    maven { url "https://s3.amazonaws.com/repo.commonsware.com" }
    mavenCentral()
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.Automattic"
        }
    }
}

static def loadPropertiesFromFile(inputFile) {
    def properties = new Properties()
    inputFile.withInputStream { stream ->
        properties.load(stream)
    }
    return properties
}

static String toSnakeCase( String text ) {
    text.replaceAll( /([A-Z])/, /_$1/ ).replaceAll( /^_/, '' )
}

def secretBuildConfigKeys = [
    "SIMPERIUM_APP_ID",
    "SIMPERIUM_APP_KEY",
    "GOOGLE_ANALYTICS_ID",
    "LOGIN_EMAIL",
    "LOGIN_PASSWORD",
    "WPCOM_CLIENT_ID",
    "SCREENSHOT_EMAIL",
    "SCREENSHOT_PASSWORD",
]
def buildDescription = gitDescribe()
def buildHash = gitHash()
def stringField = { value -> new com.android.build.api.variant.BuildConfigField("String", "\"${value}\"", null) }

androidComponents {
    onVariants(selector().all()) { variant ->
        gradle.ext.secretProperties.each { property ->
            def key = toSnakeCase(property.key).toUpperCase()
            if (key in secretBuildConfigKeys) {
                variant.buildConfigFields.put(key, stringField(property.value))
            }
        }
        variant.buildConfigFields.put("BUILD", stringField(buildDescription))
        variant.buildConfigFields.put("BUILD_HASH", stringField(buildHash))
    }
}
