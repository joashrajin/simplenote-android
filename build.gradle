// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.4.21'
    ext.google_dagger = '2.60.1'
    // KSP2 releases are versioned independently of Kotlin since 2.3.0. 2.3.13 is a defective release.
    ext.ksp_version = '2.3.14'
    ext.androidx_benchmark = '1.5.0'

    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        // AGP 9 compiles Kotlin itself (built-in Kotlin) and only needs KGP on the classpath; this pins
        // KGP above the 2.2.10 that AGP would otherwise resolve.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // The Compose compiler ships with Kotlin since 2.0, so this MUST stay equal to kotlin_version.
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:$ksp_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$google_dagger"
        classpath "androidx.benchmark:benchmark-baseline-profile-gradle-plugin:$androidx_benchmark"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 removed Project.exec; providers.exec also keeps the configuration cache aware of the command.
def gitOutput(String... args) {
    try {
        return providers.exec {
            commandLine(['git'] + args.toList())
        }.standardOutput.asText.get().trim()
    }
    catch (ignored) {
        return "<unknown>"
    }
}

def gitHash() {
    gitOutput('rev-parse', '--verify', '--short', 'HEAD')
}

def gitDescribe() {
    gitOutput('describe', '--always', '--dirty=-dirty')
}

def gitVersion() {
    (gitDescribe() =~ /^v/).replaceFirst('')
}

ext {
    // 5.x (5.8.0 and 5.12.2 tried) fails to apply on AGP 9: it looks up the removed AppExtension.
    sentryVersion = '6.27.0'

    automatticTracksVersion = '6.0.4'
    androidxLifecycleVersion = '2.9.2'

    screengrabVersion = '2.1.1'

    // Screenshot-test harness (JVM screenshot tests under Simplenote/src/test)
    // 4.18 drops SDK 23, which HtmlCompatTest runs on to cover minSdk's pre-N Html.fromHtml path.
    robolectricVersion = '4.17'
    roborazziVersion = '1.79.0'
}

def uploadKeystore = new File(gradle.ext.a8cSecretsDir, "upload.jks")
def uploadCredentials = ["storePassword", "keyAlias", "keyPassword"]
def uploadKeyAvailable = uploadKeystore.exists() &&
        uploadCredentials.every { gradle.ext.secretProperties.containsKey(it) }
def debugKeystore = new File(gradle.ext.a8cSecretsDir, "debug.keystore")

subprojects {
    plugins.withId('com.android.application') {
        android {
            signingConfigs {
                if (uploadKeyAvailable) {
                    release {
                        storeFile = uploadKeystore
                        storePassword = gradle.ext.secretProperties.get("storePassword")
                        keyAlias = gradle.ext.secretProperties.get("keyAlias")
                        keyPassword = gradle.ext.secretProperties.get("keyPassword")
                    }
                }

                if (debugKeystore.exists()) {
                    debug {
                        storeFile debugKeystore
                    }
                }
            }

            if (uploadKeyAvailable) {
                buildTypes.release.signingConfig = signingConfigs.release
            }
        }
    }
}

// Matches requested tasks, not the task graph: `lintRelease` and `minifyReleaseWithR8` must keep
// working without secrets.
def requestsReleaseArtifact = gradle.startParameter.taskNames.any {
    it.tokenize(":").last() ==~ /(assemble|bundle).*Release/
}

if (requestsReleaseArtifact && !uploadKeyAvailable) {
    throw new GradleException(
        "Release signing is not configured, so this build would not be signed. " +
            "It needs ${uploadKeystore} and the ${uploadCredentials.join(", ")} entries in secrets.properties. " +
            "Please run `a8c-secrets decrypt` to apply secrets."
    )
}
