# Compose compilation and KSP2 Hilt processing (which runs inside the Gradle daemon) OOM at the previous -Xmx1536m.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

android.enableJetifier = false
android.useAndroidX = true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# AGP 9 compiles apps against a non-final R class by default. NoteEditorFragment, NoteListFragment and
# NotesActivity still switch on R.id values (25 cases), which needs constant fields. R8's optimized
# resource shrinking (also an AGP 9 default) needs non-final IDs, so it stays off until those switches go.
android.enableAppCompileTimeRClass=false
android.r8.optimizedResourceShrinking=false
# AGP 9's strict full mode stops `-keep class X` from implying X's no-arg constructor. Room 2.6's consumer
# rule (`-keep class * extends androidx.room.RoomDatabase`, from WorkManager) then lets R8 drop
# WorkDatabase_Impl(), which Room instantiates reflectively at WorkManager startup.
android.r8.strictFullModeForKeepRules=false

# AGP 9 stopped constraining compile classpaths to runtime versions. Without this the androidTest APK compiled
# against hamcrest 1.3 but ran 2.2 (NoSuchMethodError on CoreMatchers.allOf), and the app compiled against older
# androidx versions than it ships.
android.dependency.useConstraints=true
